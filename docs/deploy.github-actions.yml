name: Deploy Astro Blog to GitHub Pages

# Deploy both the formal site (root) and the preview site (/astro-preview/)
# from one artifact. Push to branch `astro-preview` triggers deployment.
#
# One-time enablement (requires a token with the `workflow` scope):
#   1. Copy this file to .github/workflows/deploy.yml
#        cp docs/deploy.github-actions.yml .github/workflows/deploy.yml
#   2. Commit & push on branch astro-preview.
#   3. Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#   4. After the first successful run, the old master-branch Pages deploy stops.

on:
  push:
    branches: [astro-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build artifact (formal root + preview /astro-preview/)
        run: npm run build:actions
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.actions-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
